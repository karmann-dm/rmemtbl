name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'      # Ignores changes to workflows and PR templates
      - '**.md'           # Ignores changes to markdown files like README
      - '.gitignore'
      - 'LICENSE'
      - 'docs/**'         # (Optional) Ignore documentation directories

jobs:
  release-plz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz
        uses: release-plz/action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
